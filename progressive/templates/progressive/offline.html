<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Online Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
        }
        p {
            color: #888;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            background: #111;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶</div>
        <h1>Internet இல்லை!</h1>
        <p>
            உங்கள் internet connection சரி பாருங்க.<br>
            Connection வந்ததும் தானா load ஆகும்.
        </p>
        <button class="btn" onclick="window.location.reload()">
            🔄 மீண்டும் Try பண்ணு
        </button>
    </div>

    <script>
        // Auto reload when online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
