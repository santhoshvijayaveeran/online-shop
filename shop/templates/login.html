{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:420px;">
        <div style="background:white;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(108,99,255,0.2);">
            <div class="text-center mb-4">
                <div style="width:70px;height:70px;background:linear-gradient(135deg,#6c63ff,#f50057);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;">🔐</div>
                <h2 style="font-weight:700;color:#1a1a2e;">Welcome Back!</h2>
                <p style="color:#999;">Sign in to continue shopping</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label style="font-weight:600;color:#1a1a2e;margin-bottom:8px;display:block;">
                        <i class="fas fa-user me-2" style="color:#6c63ff;"></i>Username
                    </label>
                    <input type="text" name="username" required
                           style="width:100%;padding:12px 16px;border:2px solid #f0f2ff;border-radius:12px;outline:none;font-family:'Poppins',sans-serif;transition:0.3s;"
                           onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='#f0f2ff'"
                           placeholder="Enter username">
                </div>
                <div class="mb-4">
                    <label style="font-weight:600;color:#1a1a2e;margin-bottom:8px;display:block;">
                        <i class="fas fa-lock me-2" style="color:#6c63ff;"></i>Password
                    </label>
                    <div style="position:relative;">
                        <input type="password" name="password" id="passwordInput" required
                               style="width:100%;padding:12px 45px 12px 16px;border:2px solid #f0f2ff;border-radius:12px;outline:none;font-family:'Poppins',sans-serif;transition:0.3s;"
                               onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='#f0f2ff'"
                               placeholder="Enter password">
                        <button type="button" onclick="togglePassword()"
                                style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#999;cursor:pointer;">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit"
                        style="width:100%;padding:14px;background:linear-gradient(135deg,#6c63ff,#f50057);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;cursor:pointer;transition:0.3s;font-family:'Poppins',sans-serif;"
                        onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 10px 30px rgba(108,99,255,0.4)'"
                        onmouseout="this.style.transform='none';this.style.boxShadow='none'">
                    Login <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>

            <p class="text-center mt-4" style="color:#999;">
                Don't have an account?
                <a href="{% url 'register' %}" style="color:#6c63ff;font-weight:700;text-decoration:none;">Register</a>
            </p>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
