{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:380px;">
        <div style="margin-bottom:32px;">
            <h2 style="font-weight:700;font-size:1.8rem;letter-spacing:-0.5px;margin-bottom:6px;">Welcome back</h2>
            <p style="color:var(--gray);font-size:0.9rem;">Sign in to your account</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div style="background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:0.88rem;color:#e53e3e;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:16px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;color:var(--black);">Username</label>
                <input type="text" name="username" required class="input-min" placeholder="Enter your username">
            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;color:var(--black);">Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="pwInput" required class="input-min" placeholder="Enter your password" style="padding-right:40px;">
                    <button type="button" onclick="togglePw()"
                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);cursor:pointer;font-size:0.85rem;">
                        <i class="fas fa-eye" id="pwIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary-min" style="width:100%;justify-content:center;padding:12px;font-size:0.95rem;">
                Sign In
            </button>
        </form>

        <div style="text-align:center;margin-top:20px;font-size:0.88rem;color:var(--gray);">
            Don't have an account?
            <a href="{% url 'register' %}" style="color:var(--black);font-weight:600;text-decoration:none;">Sign up</a>
        </div>
    </div>
</div>
<script>
function togglePw() {
    const i = document.getElementById('pwInput');
    const ic = document.getElementById('pwIcon');
    i.type = i.type === 'password' ? 'text' : 'password';
    ic.className = i.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
{% endblock %}
