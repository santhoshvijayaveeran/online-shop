{% extends 'base.html' %}
{% block title %}Password Updated — SANZCART{% endblock %}
{% block content %}
<style>
    .login-container { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 60px 16px; background: var(--sanzcart-bg); }
    .login-box { width: 100%; max-width: 440px; background: var(--sanzcart-card); border: 1.5px solid var(--sanzcart-border); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); text-align: center; }
</style>

<div class="login-container">
    <div class="login-box">
        <div style="width: 80px; height: 80px; background: rgba(0,184,83,0.1); color: #00b853; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 24px;">
            <i class="fas fa-lock"></i>
        </div>
        <h2 style="font-family:var(--font-heading); font-size:1.8rem; font-weight:900; margin-bottom:12px;">Update Successful</h2>
        <p style="color:var(--sanzcart-muted); font-size:1rem; line-height:1.6; margin-bottom:32px;">Your password has been reset. You can now log in with your new password.</p>
        
        <a href="{% url 'login' %}" class="btn-primary-sc" style="width:100%; text-decoration:none;">Login Now</a>
    </div>
</div>
{% endblock %}
