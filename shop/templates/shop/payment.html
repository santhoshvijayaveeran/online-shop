{% extends 'base.html' %}
{% block title %}Payment — SANZCART{% endblock %}
{% block content %}
<style>
    .bg-main { background: var(--sanzcart-bg); }
    .payment-card { background: var(--sanzcart-card); border: 1.5px solid var(--sanzcart-border); border-radius: 14px; padding: 40px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
    .btn-primary-sc { background: var(--sanzcart-primary); color: #fff; padding: 14px 28px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; border: none; width: 100%; cursor: pointer; text-decoration: none; }
    .btn-primary-sc:hover { background: #d32f2f; transform: translateY(-2px); }
</style>
<div class="bg-main" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:480px;">
        <div class="payment-card">
            <div style="font-size:2.5rem;margin-bottom:16px;">💳</div>
            <h3 style="font-weight:800;font-family:var(--font-heading);letter-spacing:-0.5px;margin-bottom:6px;color:var(--sanzcart-text);">Complete Payment</h3>
            <p style="color:var(--sanzcart-muted);font-size:0.95rem;margin-bottom:28px;">Order #{{ order.id }} · ${{ total }}</p>

            <div style="background:var(--sanzcart-bg);border-radius:12px;padding:24px;margin-bottom:32px;">
                <div style="font-size:2rem;font-weight:800;font-family:var(--font-heading);letter-spacing:-1px;color:var(--sanzcart-primary);">${{ total }}</div>
                <div style="font-size:0.85rem;color:var(--sanzcart-muted);margin-top:4px;font-weight:600;">Total Amount</div>
            </div>

            <button id="rzp-btn" class="btn-primary-sc">
                Pay Now
            </button>

            <a href="{% url 'cart' %}" style="display:block;font-size:0.9rem;font-weight:600;color:var(--sanzcart-muted);text-decoration:none;margin-top:16px;transition:0.2s;" onmouseover="this.style.color='var(--sanzcart-primary)'" onmouseout="this.style.color='var(--sanzcart-muted)'">
                ← Back to Cart
            </a>

            <p style="font-size:0.8rem;font-weight:600;color:var(--sanzcart-muted);margin-top:24px;">
                <i class="fas fa-lock" style="color:var(--sanzcart-primary);margin-right:6px;"></i> 100% Secure · Powered by Razorpay
            </p>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    key: "{{ razorpay_key }}",
    amount: "{{ amount }}",
    currency: "INR",
    name: "Online Shop",
    description: "Order #{{ order.id }}",
    order_id: "{{ razorpay_order_id }}",
    handler: function(response) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = "{% url 'payment_success' %}";

        var fields = {
            'razorpay_payment_id': response.razorpay_payment_id,
            'razorpay_order_id': response.razorpay_order_id,
            'razorpay_signature': response.razorpay_signature,
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        };

        Object.keys(fields).forEach(key => {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
    },
    prefill: {
        name: "{{ user.username }}",
        email: "{{ user.email }}"
    },
    theme: { color: "#111111" },
    modal: {
        ondismiss: function() {
            window.location.href = "{% url 'payment_failed' %}";
        }
    }
};

document.getElementById('rzp-btn').onclick = function() {
    var rzp = new Razorpay(options);
    rzp.open();
};
</script>
{% endblock %}
