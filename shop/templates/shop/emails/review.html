<!DOCTYPE html>
<html>
<body style="font-family: 'Outfit', Arial, sans-serif; background: #f7f4ef; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h1 style="color: #1a1a1a; margin-top: 0; font-family: 'Syne', sans-serif;">SANZ<span style="color: #e63946;">CART</span></h1>
        <h2 style="color: #1a1a1a; margin-top: 20px;">⭐ Thanks for your Review!</h2>
        <p style="color: #333; font-size: 16px;">Hi {{ username }}, thank you for taking the time to review <strong>{{ product.name }}</strong> with {{ rating }} stars!</p>
        <p style="color: #9a9590; font-size: 14px; margin-top: 20px;">Your feedback helps other shoppers make better decisions.</p>
    </div>
</body>
</html>
