<!DOCTYPE html>
<html>
<body>
    <h2>🛒 Order Confirmation</h2>
    <p>Hi <strong>{{ username }}</strong>, thank you for your order!</p>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            {% for item in cart_items %}
            <tr>
                <td>{{ item.product.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>₹{{ item.get_subtotal }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <h3>Total: ₹{{ total }}</h3>
    <p>We will process your order soon. Thank you for shopping with us! 🎉</p>
</body>
</html>
