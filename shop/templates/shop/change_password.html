{% extends 'base.html' %}
{% block title %}Change Password — SANZCART{% endblock %}
{% block content %}
<style>
    .bg-main { background: var(--sanzcart-bg); }
    .form-card { background: var(--sanzcart-card); border: 1.5px solid var(--sanzcart-border); border-radius: 14px; padding: 32px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
    .form-control-sc { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--sanzcart-border); background: var(--sanzcart-bg); color: var(--sanzcart-text); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: 0.2s; }
    .form-control-sc:focus { border-color: var(--sanzcart-primary); background: var(--sanzcart-card); }
    .btn-primary-sc { background: var(--sanzcart-primary); color: #fff; padding: 14px 28px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; border: none; width: 100%; cursor: pointer; text-decoration: none; }
    .btn-primary-sc:hover { background: #d32f2f; transform: translateY(-2px); color: #fff; }
</style>
<div class="bg-main" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:440px;">
        <div style="margin-bottom:28px;">
            <a href="{% url 'profile' %}" style="font-size:0.9rem;font-weight:600;color:var(--sanzcart-muted);text-decoration:none;transition:0.2s;" onmouseover="this.style.color='var(--sanzcart-primary)'" onmouseout="this.style.color='var(--sanzcart-muted)'">← Back to Profile</a>
            <h2 style="font-family:var(--font-heading);font-weight:800;letter-spacing:-0.5px;margin-top:12px;color:var(--sanzcart-text);">Change Password</h2>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div style="background:{% if 'error' in message.tags %}rgba(230,57,70,0.1);border:1.5px solid #d32f2f;color:#d32f2f;{% else %}rgba(0,184,83,0.1);border:1.5px solid #00b853;color:#00b853;{% endif %}border-radius:8px;padding:16px;margin-bottom:24px;font-size:0.95rem;font-weight:600;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;font-size:0.85rem;margin-bottom:8px;color:var(--sanzcart-muted);">Current Password</label>
                    <input type="password" name="old_password" required class="form-control-sc" placeholder="Enter current password">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;font-size:0.85rem;margin-bottom:8px;color:var(--sanzcart-muted);">New Password</label>
                    <input type="password" name="new_password1" required class="form-control-sc" placeholder="Enter new password">
                </div>
                <div style="margin-bottom:32px;">
                    <label style="display:block;font-weight:700;font-size:0.85rem;margin-bottom:8px;color:var(--sanzcart-muted);">Confirm New Password</label>
                    <input type="password" name="new_password2" required class="form-control-sc" placeholder="Repeat new password">
                </div>
                <button type="submit" class="btn-primary-sc">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
