{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:420px;">
        <div style="margin-bottom:28px;">
            <a href="{% url 'profile' %}" style="font-size:0.85rem;color:var(--gray);text-decoration:none;">← Back to Profile</a>
            <h2 style="font-weight:700;letter-spacing:-0.5px;margin-top:10px;">Change Password</h2>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div style="background:{% if 'error' in message.tags %}#fff5f5;border:1px solid #fed7d7;color:#e53e3e;{% else %}#f0fff4;border:1px solid #c6f6d5;color:#276749;{% endif %}border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:0.88rem;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <div style="background:white;border:1px solid var(--border);border-radius:12px;padding:28px;">
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Current Password</label>
                    <input type="password" name="old_password" required class="input-min" placeholder="Enter current password">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">New Password</label>
                    <input type="password" name="new_password1" required class="input-min" placeholder="Enter new password">
                </div>
                <div style="margin-bottom:24px;">
                    <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Confirm New Password</label>
                    <input type="password" name="new_password2" required class="input-min" placeholder="Repeat new password">
                </div>
                <button type="submit" class="btn-primary-min" style="width:100%;justify-content:center;padding:12px;">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
