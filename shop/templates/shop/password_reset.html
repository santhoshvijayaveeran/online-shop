{% extends 'base.html' %}
{% block title %}Reset Password — SANZCART{% endblock %}
{% block content %}
<style>
    .login-container { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 60px 16px; background: var(--sanzcart-bg); }
    .login-box { width: 100%; max-width: 440px; background: var(--sanzcart-card); border: 1.5px solid var(--sanzcart-border); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header h2 { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 8px; color: var(--sanzcart-text); }
    .login-header p { color: var(--sanzcart-muted); font-size: 0.95rem; font-weight: 500; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-weight: 800; font-size: 0.75rem; color: var(--sanzcart-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .form-control-sc { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--sanzcart-border); background: var(--sanzcart-bg); color: var(--sanzcart-text); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: 0.2s; }
    .form-control-sc:focus { border-color: var(--sanzcart-primary); background: #fff; box-shadow: 0 0 0 4px rgba(230,57,70,0.05); }
    .btn-login { width: 100%; background: var(--sanzcart-primary); color: #fff; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-login:hover { background: #d32f2f; transform: translateY(-2px); }
</style>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2>Forgot Password</h2>
            <p>Enter your email to receive a reset link</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control-sc" placeholder="john@example.com" required>
            </div>
            <button type="submit" class="btn-login">
                Send Reset Link <i class="fas fa-paper-plane"></i>
            </button>
        </form>

        <div style="text-align:center; margin-top:32px; font-size:0.95rem; color:var(--sanzcart-muted); font-weight:500;">
            Remembered? <a href="{% url 'login' %}" style="color:var(--sanzcart-primary); font-weight:800; text-decoration:none;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
