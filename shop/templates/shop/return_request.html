{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:480px;">
        <div style="background:white;border:1px solid var(--border);border-radius:14px;padding:36px;">
            <div style="margin-bottom:28px;">
                <h3 style="font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;">Request Return</h3>
                <p style="color:var(--gray);font-size:0.9rem;">Order #{{ order.id }} · Return by {{ return_deadline|date:"M d, Y" }}</p>
            </div>

            <div style="background:#fffbeb;border:1px solid #fef3c7;border-radius:8px;padding:14px;margin-bottom:24px;font-size:0.85rem;color:#92400e;">
                🔄 <strong>7-Day Return Policy</strong> — Items must be unused and in original packaging.
            </div>

            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);">Reason</label>
                    <select name="reason" required class="input-min">
                        <option value="">Select reason...</option>
                        <option value="defective">Defective Product</option>
                        <option value="wrong_item">Wrong Item Received</option>
                        <option value="not_needed">No Longer Needed</option>
                        <option value="size_issue">Size / Fit Issue</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div style="margin-bottom:24px;">
                    <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);">Additional Details</label>
                    <textarea name="description" rows="4" class="input-min" style="resize:none;"
                              placeholder="Please describe the issue..."></textarea>
                </div>
                <button type="submit" class="btn-primary-min" style="width:100%;justify-content:center;padding:13px;font-size:0.95rem;margin-bottom:10px;">
                    Submit Return Request
                </button>
                <a href="{% url 'my_orders' %}" style="display:block;text-align:center;font-size:0.85rem;color:var(--gray);text-decoration:none;margin-top:8px;">← Back to Orders</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
