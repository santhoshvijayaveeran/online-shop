{% extends 'base.html' %}
{% block content %}
<div style="padding:40px;">
    <h2>Products</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">
        {% for product in products %}
        <div style="border:1px solid #ddd;border-radius:10px;padding:15px;text-align:center;">
            {% if product.image %}
                <img src="{{ product.image.url }}" style="width:100%;height:200px;object-fit:cover;border-radius:8px;">
            {% endif %}
            <h3>{{ product.name }}</h3>
            <p>₹{{ product.price }}</p>
            <a href="/product/{{ product.id }}/">View Details</a>
        </div>
        {% empty %}
            <p>No products yet. Add from <a href="/admin/">Admin Panel</a></p>
        {% endfor %}
    </div>
</div>
{% endblock %}
