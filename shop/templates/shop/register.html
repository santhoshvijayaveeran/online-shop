{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:400px;">
        <div style="margin-bottom:32px;">
            <h2 style="font-weight:700;font-size:1.8rem;letter-spacing:-0.5px;margin-bottom:6px;">Create account</h2>
            <p style="color:var(--gray);font-size:0.9rem;">Join us today, it's free</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div style="background:{% if 'error' in message.tags %}#fff5f5;border:1px solid #fed7d7;color:#e53e3e;{% else %}#f0fff4;border:1px solid #c6f6d5;color:#276749;{% endif %}border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:0.88rem;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:14px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;">Username</label>
                <input type="text" name="username" required class="input-min" placeholder="Choose a username">
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;">Email</label>
                <input type="email" name="email" required class="input-min" placeholder="your@email.com">
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;">Password</label>
                <input type="password" name="password1" required class="input-min" placeholder="Create a password">
            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;">Confirm Password</label>
                <input type="password" name="password2" required class="input-min" placeholder="Repeat your password">
            </div>
            <button type="submit" class="btn-primary-min" style="width:100%;justify-content:center;padding:12px;font-size:0.95rem;">
                Create Account
            </button>
        </form>

        <div style="text-align:center;margin-top:20px;font-size:0.88rem;color:var(--gray);">
            Already have an account?
            <a href="{% url 'login' %}" style="color:var(--black);font-weight:600;text-decoration:none;">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
