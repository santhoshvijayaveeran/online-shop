{% extends 'base.html' %}
{% block title %}Sign Up — SANZCART{% endblock %}
{% block content %}
<style>
    .form-control-sc { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--sanzcart-border); background: var(--sanzcart-bg); color: var(--sanzcart-text); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: 0.2s; }
    .form-control-sc:focus { border-color: var(--sanzcart-primary); background: var(--sanzcart-card); }
    .btn-primary-sc { background: var(--sanzcart-primary); color: #fff; padding: 14px 28px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; border: none; cursor: pointer; text-decoration: none; }
    .btn-primary-sc:hover { background: #d32f2f; transform: translateY(-2px); color: #fff; }
</style>
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--sanzcart-bg);">
    <div style="width:100%;max-width:440px;">
        <div style="background:var(--sanzcart-card);border:1.5px solid var(--sanzcart-border);border-radius:14px;padding:40px;box-shadow:0 5px 15px rgba(0,0,0,.02);">
            <div style="text-align:center;margin-bottom:28px;">
                <div style="font-family:var(--font-heading);font-size:2.2rem;font-weight:900;margin-bottom:4px;letter-spacing:-1px;color:var(--sanzcart-text);"><span style="color:var(--sanzcart-primary)">SANZ</span>CART</div>
                <p style="color:var(--sanzcart-muted);font-size:.95rem;font-weight:500;">Create your account</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;font-size:.85rem;color:var(--sanzcart-muted);margin-bottom:8px;">Username</label>
                    <input type="text" name="username" required class="form-control-sc" placeholder="Choose a username">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;font-size:.85rem;color:var(--sanzcart-muted);margin-bottom:8px;">Email</label>
                    <input type="email" name="email" required class="form-control-sc" placeholder="your@email.com">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;font-size:.85rem;color:var(--sanzcart-muted);margin-bottom:8px;">Password</label>
                    <input type="password" name="password1" required class="form-control-sc" placeholder="Create password">
                </div>
                <div style="margin-bottom:28px;">
                    <label style="display:block;font-weight:700;font-size:.85rem;color:var(--sanzcart-muted);margin-bottom:8px;">Confirm Password</label>
                    <input type="password" name="password2" required class="form-control-sc" placeholder="Confirm password">
                </div>
                <button type="submit" class="btn-primary-sc" style="width:100%;justify-content:center;padding:14px;font-size:1rem;">
                    Create Account <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
            <div style="text-align:center;margin-top:24px;font-size:.95rem;color:var(--sanzcart-muted);font-weight:500;">
                Already have an account?
                <a href="{% url 'login' %}" style="color:var(--sanzcart-primary);font-weight:700;text-decoration:none;">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
