{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div style="max-width:640px;margin:0 auto;">
        <div style="margin-bottom:28px;">
            <a href="{% url 'manage_products' %}" style="font-size:0.85rem;color:var(--gray);text-decoration:none;">← Manage Products</a>
            <h2 style="font-weight:700;letter-spacing:-0.5px;margin-top:10px;">Add Product</h2>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div style="background:white;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;">
                <h6 style="font-weight:700;font-size:0.82rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-bottom:18px;">Product Info</h6>
                <div class="row g-3">
                    <div class="col-12">
                        <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Product Name *</label>
                        <input type="text" name="name" required class="input-min" placeholder="Enter product name">
                    </div>
                    <div class="col-12">
                        <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Description</label>
                        <textarea name="description" rows="3" class="input-min" style="resize:none;" placeholder="Product description..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Price (₹) *</label>
                        <input type="number" name="price" required class="input-min" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Stock *</label>
                        <input type="number" name="stock" required class="input-min" placeholder="0" min="0">
                    </div>
                    <div class="col-12">
                        <label style="display:block;font-weight:600;font-size:0.82rem;margin-bottom:6px;">Category *</label>
                        <select name="category" required class="input-min">
                            <option value="">Select category...</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div style="background:white;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;">
                <h6 style="font-weight:700;font-size:0.82rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray);margin-bottom:14px;">Product Image</h6>
                <input type="file" name="image" accept="image/*" class="input-min" style="padding:8px;">
                <div style="font-size:0.75rem;color:var(--gray);margin-top:6px;">JPG, PNG — Max 5MB</div>
            </div>

            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn-primary-min" style="padding:12px 28px;">Add Product</button>
                <a href="{% url 'manage_products' %}" class="btn-outline-min" style="padding:12px 28px;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
