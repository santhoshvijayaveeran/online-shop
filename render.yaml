services:
  - type: web
    name: online-shop
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn online_shop.wsgi --bind 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: online-shop-db
          property: connectionString
      - fromGroup: online-shop-secrets

databases:
  - name: online-shop-db
    databaseName: online_shop
    user: online_shop_user
    plan: free
